<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>PDF 뷰어 앱</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- PWA 설정 -->
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#ffffff" />

  <style>
    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
        sans-serif;
      background: #f5f5f5;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    header {
      padding: 12px 16px;
      background: #222;
      color: #fff;
      font-size: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    main {
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    .btn-container {
      padding: 12px 16px;
      text-align: center;
      background: #f5f5f5;
    }

    button {
      padding: 10px 18px;
      font-size: 15px;
      border-radius: 999px;
      border: none;
      cursor: pointer;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.15);
    }

    iframe {
      flex: 1;
      border: none;
      width: 100%;
    }

    .hint {
      font-size: 12px;
      color: #555;
      margin-top: 6px;
      line-height: 1.4;
    }
  </style>
</head>
<body>
  <header>PDF 뷰어 앱</header>

  <main>
    <div class="btn-container">
      <button id="openPdfBtn">PDF 열기</button>
      <div class="hint">
        앱을 설치하려면 브라우저 메뉴에서<br />
        <b>“홈 화면에 추가”</b>를 선택하세요.
      </div>
    </div>

    <!-- 처음엔 빈 프레임, 버튼 누르면 PDF 로드 -->
    <iframe id="pdfFrame" src=""></iframe>
  </main>

  <script>
    // 버튼 클릭 시 PDF 로드
    document.getElementById("openPdfBtn").addEventListener("click", function () {
      // pdf/book.pdf 위치에 있는 파일을 불러옵니다.
      document.getElementById("pdfFrame").src = "pdf/book.pdf";
    });

    // 서비스 워커 등록(PWA 기능)
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", function () {
        navigator.serviceWorker
          .register("service-worker.js")
          .catch(function (error) {
            console.log("Service Worker 등록 실패:", error);
          });
      });
    }
  </script>
</body>
</html>
